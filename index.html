<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata</title>
<meta name="description" content="Name one thing. The rarer your answer, the deeper you dig.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>⛏</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#E8D5A8;
  --sun:#F0B44C;
  --soil1:#6B4423;
  --soil2:#54351C;
  --clay:#7A4A28;
  --rock:#2E2419;
  --deep:#1A1410;
  --bedrock:#0D0A08;
  --amber:#F0B44C;
  --hot:#E2663B;
  --bone:#F2E8D5;
  --dim:#A08B6B;
  --mono:"DM Mono",ui-monospace,monospace;
  --fat:"Archivo Black",system-ui,sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--bedrock);
  color:var(--bone);
  font-family:var(--mono);
  -webkit-font-smoothing:none;
  font-smooth:never;
}

#world{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}

/* ---------------- HUD ---------------- */
.hud{
  position:fixed;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:14px 16px;gap:12px;pointer-events:none;z-index:10;
}
.gauge{
  background:rgba(13,10,8,.82);
  border:2px solid var(--rock);
  padding:7px 13px;
  min-width:108px;
  backdrop-filter:blur(2px);
}
.gauge .k{font-size:9px;letter-spacing:.18em;color:var(--dim);margin:0 0 3px}
/* Tabular figures: the depth readout counts up every frame, and proportional
   digits make the whole gauge twitch as the width changes. */
.gauge .v{
  font-size:19px;margin:0;line-height:1;color:var(--amber);
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
}
.gauge.score .v{color:var(--hot)}
.gauge.mid{text-align:center;min-width:0;background:none;border:none}
.pips{display:flex;gap:4px;justify-content:center;margin-bottom:5px}
.pip{
  width:13px;height:13px;border:2px solid var(--rock);background:rgba(13,10,8,.6);
  transition:background .2s,border-color .2s;
}
.pip.done{background:var(--amber);border-color:var(--amber)}
.pip.now{
  background:var(--hot);border-color:var(--hot);
  box-shadow:0 0 9px rgba(226,102,59,.6);
}
.gauge.mid .k{color:var(--dim)}

/* ---------------- centre stage ---------------- */
.stage{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:80px 20px 28px;
  z-index:10;
  text-align:center;
}
.stage > *{pointer-events:auto;position:relative;z-index:1}
/* A soft scrim behind the copy. The dig site is busy and the lamp glow sits
   right where the text does, so the words need their own ground to sit on. */
/* Tight and dark rather than wide and hazy. The old scrim spread a soft fog
   across most of the frame, which is what made the dig read as out of focus;
   this one is opaque where the words actually are and gone by the edges, so the
   strata and the finds stay sharp. */
.stage::before{
  content:"";position:absolute;inset:0;z-index:0;
  background:radial-gradient(ellipse 30% 22% at 50% 52%,
    rgba(13,10,8,.94) 0%,rgba(13,10,8,.82) 40%,rgba(13,10,8,.4) 72%,rgba(13,10,8,0) 100%);
  pointer-events:none;
}
/* The results screen is far taller than the round scrim above, so its copy ran
   off the dark ground and onto lit dirt. It gets a real panel instead. */
.stage.results::before{
  background:linear-gradient(rgba(13,10,8,.97),rgba(13,10,8,.97));
  -webkit-mask-image:radial-gradient(ellipse 62% 78% at 50% 50%,
    #000 0%,#000 58%,rgba(0,0,0,.55) 82%,transparent 100%);
  mask-image:radial-gradient(ellipse 62% 78% at 50% 50%,
    #000 0%,#000 58%,rgba(0,0,0,.55) 82%,transparent 100%);
}

.eyebrow{
  font-size:10px;letter-spacing:.3em;color:var(--bone);
  margin:0 0 14px;opacity:.75;
  text-shadow:0 1px 3px rgba(13,10,8,.9);
}

.prompt{
  font-family:var(--fat);
  font-size:clamp(26px,5.2vw,50px);
  line-height:1.08;
  margin:0 0 6px;
  max-width:16ch;
  text-shadow:0 3px 0 rgba(13,10,8,.75);
  animation:rise .38s ease-out both;
}
.hint{
  font-size:11px;color:var(--dim);letter-spacing:.14em;margin:14px 0 0;
  animation:rise .38s .16s ease-out both;
}

/* ---------------- input ---------------- */
.entry{
  display:flex;gap:9px;margin-top:26px;flex-wrap:wrap;justify-content:center;
  width:100%;max-width:440px;
  animation:rise .38s .08s ease-out both;
}
input[type=text]{
  flex:1 1 210px;min-width:0;
  background:rgba(13,10,8,.88);
  border:2px solid var(--clay);
  color:var(--bone);
  font-family:var(--mono);font-size:17px;
  padding:13px 14px;text-align:center;
  transition:border-color .15s,box-shadow .15s;
}
input[type=text]:focus{
  outline:none;border-color:var(--amber);
  box-shadow:0 0 0 3px rgba(240,180,76,.16);
}
input[type=text]::placeholder{color:#6B5940}

button{
  font-family:var(--mono);font-weight:500;font-size:13px;letter-spacing:.16em;
  padding:13px 24px;cursor:pointer;
  background:var(--amber);color:var(--bedrock);
  border:2px solid var(--amber);
  transition:background .14s,border-color .14s,transform .08s,box-shadow .14s;
}
button:hover:not(:disabled){
  background:#FFC85E;border-color:#FFC85E;
  box-shadow:0 0 18px rgba(240,180,76,.3);
}
button:active:not(:disabled){transform:translateY(2px)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid var(--bone);outline-offset:2px}
button.ghost{background:none;color:var(--bone);border-color:var(--clay)}
button.ghost:hover{background:rgba(122,74,40,.35);box-shadow:none}

/* ---------------- timer ---------------- */
.clock{
  font-size:34px;color:var(--amber);margin:0 0 4px;line-height:1;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  text-shadow:0 2px 0 rgba(13,10,8,.8);
}
/* Under five seconds the clock should be felt, not read. */
.clock.low{color:var(--hot);animation:pulse .9s ease-in-out infinite}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.13);opacity:.8}
}

/* ---------------- verdict ---------------- */
.tier{
  font-family:var(--fat);
  font-size:clamp(34px,8vw,76px);
  margin:0 0 10px;line-height:1;
  color:var(--amber);
  text-shadow:0 4px 0 rgba(13,10,8,.8);
}
.tier.t-surface,.tier.t-tooclever{color:#9C8259}
.tier.t-none{color:#6B5940}
.tier.t-good{color:#7FC4A8}
.tier.t-deep{color:#7FB0E8}
/* Real credit, but explicitly unverified — so it reads warm, not triumphant. */
.tier.t-unverified{color:#9FC9B4}
.tier.t-unlisted{color:var(--hot)}
.said{font-size:17px;margin:0 0 8px;color:var(--bone)}
.gain{font-size:14px;color:var(--amber);margin:0 0 4px;letter-spacing:.1em}
.atdepth{font-size:12px;color:var(--bone);opacity:.6;margin:0 0 8px;letter-spacing:.1em}
.note{font-size:12px;color:var(--dim);margin:0;letter-spacing:.06em}

/* The verdict is the payoff beat — it should arrive, not just appear. */
.tier{animation:stamp .34s cubic-bezier(.2,1.5,.4,1) both}
.said,.gain,.atdepth,.note,.deeper{animation:rise .4s ease-out both}
.said{animation-delay:.06s}
.gain{animation-delay:.11s}
.atdepth{animation-delay:.15s}
.note{animation-delay:.19s}
.deeper{animation-delay:.25s}
@keyframes stamp{
  from{transform:scale(1.5);opacity:0;filter:blur(3px)}
  to{transform:scale(1);opacity:1;filter:none}
}
@keyframes rise{from{transform:translateY(7px);opacity:0}to{transform:none;opacity:1}}

/* What you could have said. Set below the verdict and quieter than it — the
   score is the headline, this is the lesson you take into the next run. */
.deeper{
  margin:22px auto 0;padding:11px 16px;max-width:30ch;
  border:1px solid var(--rock);background:rgba(13,10,8,.6);
}
.deeper-k{font-size:9px;letter-spacing:.2em;color:var(--dim);margin:0 0 5px}
.deeper-v{font-size:13px;line-height:1.6;color:#7FB0E8;margin:0;overflow-wrap:anywhere}

/* ---------------- results ---------------- */
.final{
  font-family:var(--fat);font-size:clamp(38px,10vw,84px);margin:0;line-height:1;color:var(--amber);
  text-shadow:0 4px 0 rgba(13,10,8,.8);
  animation:stamp .42s cubic-bezier(.2,1.5,.4,1) both;
}
/* The landmark line is the one that makes the number mean something, so it
   gets the emphasis and the raw verdict sits under it, quieter. */
.finalsub{font-size:14px;color:var(--bone);letter-spacing:.06em;margin:10px 0 2px;animation:rise .4s .12s ease-out both;text-shadow:0 1px 3px rgba(13,10,8,.9)}
.finalsub2{font-size:12px;color:#C9B08A;letter-spacing:.14em;margin:0 0 18px;animation:rise .4s .18s ease-out both}
/* The line that makes the whole run mean something — sized to be the second
   thing read after the depth itself. */
.beat{
  font-family:var(--fat);
  font-size:clamp(15px,3.2vw,21px);
  color:var(--hot);margin:14px 0 2px;line-height:1.25;
  text-shadow:0 2px 0 rgba(13,10,8,.8);
  animation:rise .4s .22s ease-out both;
}

.tape{
  font-size:12px;line-height:1.6;margin:0 0 20px;
  max-height:34vh;overflow-y:auto;width:100%;max-width:440px;
  border-top:1px solid var(--rock);border-bottom:1px solid var(--rock);padding:9px 10px;
  /* The default scrollbar was a bright white slab against the dirt. */
  scrollbar-width:thin;scrollbar-color:var(--clay) transparent;
}
.tape::-webkit-scrollbar{width:8px}
.tape::-webkit-scrollbar-track{background:rgba(13,10,8,.5)}
.tape::-webkit-scrollbar-thumb{background:var(--clay);border-radius:4px}
.tape .row{
  padding:6px 2px;border-left:2px solid transparent;text-align:left;
}
.tape .row + .row{border-top:1px solid rgba(46,36,25,.55)}
/* 11px dim-on-dirt was the worst offender in the tape. The prompt is context,
   so it stays quieter than the answer — but quiet, not illegible. */
.tape .q{
  margin:0 0 3px;font-size:12px;color:#C9B08A;
  letter-spacing:.02em;overflow-wrap:anywhere;
}
.tape .ans{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.tape .a{color:var(--bone);overflow-wrap:anywhere;text-align:left;font-size:14px}
.tape .p{color:#C9A46A;white-space:nowrap;font-size:11px;letter-spacing:.06em}
.row.big{border-left-color:var(--hot);padding-left:7px;background:rgba(226,102,59,.07)}
.row.big .p{color:var(--hot)}
.rowbtns{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}

.intro-copy{font-size:13px;color:var(--dim);line-height:1.8;max-width:34ch;margin:0 0 14px}
.intro-copy b{color:var(--bone);font-weight:400}
.intro-foot{
  font-size:10px;letter-spacing:.16em;color:var(--amber);opacity:.72;
  margin:0 0 24px;
}

@media (max-width:480px){
  .hud{padding:10px}
  .gauge{padding:5px 9px;min-width:74px}
  .gauge .v{font-size:16px}
  .pip{width:10px;height:10px}
  .stage{padding:74px 14px 20px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="world" aria-hidden="true"></canvas>

<div class="hud">
  <div class="gauge">
    <p class="k">DEPTH</p>
    <p class="v" id="depth">0m</p>
  </div>
  <div class="gauge mid">
    <div class="pips" id="pips"></div>
    <p class="k" id="stratum">SURFACE</p>
  </div>
  <div class="gauge score">
    <p class="k">SCORE</p>
    <p class="v" id="score">0</p>
  </div>
</div>

<main class="stage" id="stage"></main>

<script type="module" src="./main.js"></script>
</body>
</html>
