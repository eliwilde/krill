<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata</title>
<meta name="description" content="Name one thing. The rarer your answer, the deeper you dig.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>⛏</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#E8D5A8;
  --sun:#F0B44C;
  --soil1:#6B4423;
  --soil2:#54351C;
  --clay:#7A4A28;
  --rock:#2E2419;
  --deep:#1A1410;
  --bedrock:#0D0A08;
  --amber:#F0B44C;
  --hot:#E2663B;
  --bone:#F2E8D5;
  --dim:#A08B6B;
  --mono:"DM Mono",ui-monospace,monospace;
  --fat:"Archivo Black",system-ui,sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--bedrock);
  color:var(--bone);
  font-family:var(--mono);
  -webkit-font-smoothing:none;
  font-smooth:never;
}

#world{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}

/* ---------------- HUD ---------------- */
.hud{
  position:fixed;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:14px 16px;gap:12px;pointer-events:none;z-index:10;
}
.gauge{
  background:rgba(13,10,8,.82);
  border:2px solid var(--rock);
  padding:7px 13px;
  min-width:92px;
}
.gauge .k{font-size:9px;letter-spacing:.18em;color:var(--dim);margin:0 0 3px}
.gauge .v{font-size:19px;margin:0;line-height:1;color:var(--amber)}
.gauge.score .v{color:var(--hot)}
.gauge.mid{text-align:center;min-width:0;background:none;border:none}
.pips{display:flex;gap:4px;justify-content:center;margin-bottom:5px}
.pip{width:13px;height:13px;border:2px solid var(--rock);background:rgba(13,10,8,.6)}
.pip.done{background:var(--amber);border-color:var(--amber)}
.pip.now{background:var(--hot);border-color:var(--hot)}
.gauge.mid .k{color:var(--dim)}

/* ---------------- centre stage ---------------- */
.stage{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:80px 20px 28px;
  z-index:10;
  text-align:center;
}
.stage > *{pointer-events:auto;position:relative;z-index:1}
/* A soft scrim behind the copy. The dig site is busy and the lamp glow sits
   right where the text does, so the words need their own ground to sit on. */
.stage::before{
  content:"";position:absolute;inset:0;z-index:0;
  background:radial-gradient(ellipse 42% 34% at 50% 52%,rgba(13,10,8,.8) 0%,rgba(13,10,8,.45) 55%,rgba(13,10,8,0) 100%);
  pointer-events:none;
}

.eyebrow{
  font-size:10px;letter-spacing:.3em;color:var(--bone);
  margin:0 0 14px;opacity:.75;
  text-shadow:0 1px 3px rgba(13,10,8,.9);
}

.prompt{
  font-family:var(--fat);
  font-size:clamp(26px,5.2vw,50px);
  line-height:1.08;
  margin:0 0 6px;
  max-width:16ch;
  text-shadow:0 3px 0 rgba(13,10,8,.75);
}
.hint{font-size:11px;color:var(--dim);letter-spacing:.14em;margin:14px 0 0}

/* ---------------- input ---------------- */
.entry{display:flex;gap:9px;margin-top:26px;flex-wrap:wrap;justify-content:center;width:100%;max-width:440px}
input[type=text]{
  flex:1 1 210px;min-width:0;
  background:rgba(13,10,8,.88);
  border:2px solid var(--clay);
  color:var(--bone);
  font-family:var(--mono);font-size:17px;
  padding:13px 14px;text-align:center;
}
input[type=text]:focus{outline:none;border-color:var(--amber)}
input[type=text]::placeholder{color:#6B5940}

button{
  font-family:var(--mono);font-weight:500;font-size:13px;letter-spacing:.16em;
  padding:13px 24px;cursor:pointer;
  background:var(--amber);color:var(--bedrock);
  border:2px solid var(--amber);
}
button:hover:not(:disabled){background:#FFC85E;border-color:#FFC85E}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid var(--bone);outline-offset:2px}
button.ghost{background:none;color:var(--bone);border-color:var(--clay)}
button.ghost:hover{background:rgba(122,74,40,.35)}

/* ---------------- timer ---------------- */
.clock{
  font-size:34px;color:var(--amber);margin:0 0 4px;line-height:1;
}
.clock.low{color:var(--hot)}

/* ---------------- verdict ---------------- */
.tier{
  font-family:var(--fat);
  font-size:clamp(34px,8vw,76px);
  margin:0 0 10px;line-height:1;
  color:var(--amber);
  text-shadow:0 4px 0 rgba(13,10,8,.8);
}
.tier.t-surface,.tier.t-tooclever{color:#9C8259}
.tier.t-none{color:#6B5940}
.tier.t-good{color:#7FC4A8}
.tier.t-deep{color:#7FB0E8}
.tier.t-unlisted{color:var(--hot)}
.said{font-size:17px;margin:0 0 8px;color:var(--bone)}
.gain{font-size:14px;color:var(--amber);margin:0 0 6px;letter-spacing:.1em}
.note{font-size:12px;color:var(--dim);margin:0;letter-spacing:.06em}

/* ---------------- results ---------------- */
.final{font-family:var(--fat);font-size:clamp(42px,11vw,92px);margin:0;line-height:1;color:var(--amber)}
.finalsub{font-size:12px;color:var(--dim);letter-spacing:.14em;margin:6px 0 18px}
.tape{
  font-size:12px;line-height:1.85;margin:0 0 20px;
  max-height:32vh;overflow-y:auto;width:100%;max-width:400px;
  border-top:1px solid var(--rock);border-bottom:1px solid var(--rock);padding:9px 0;
}
.tape .row{display:flex;justify-content:space-between;gap:12px}
.tape .a{color:var(--bone);overflow-wrap:anywhere;text-align:left}
.tape .p{color:var(--dim);white-space:nowrap}
.row.big .p{color:var(--hot)}
.rowbtns{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}

.intro-copy{font-size:13px;color:var(--dim);line-height:1.8;max-width:34ch;margin:0 0 26px}
.intro-copy b{color:var(--bone);font-weight:400}

@media (max-width:480px){
  .hud{padding:10px}
  .gauge{padding:5px 9px;min-width:74px}
  .gauge .v{font-size:16px}
  .pip{width:10px;height:10px}
  .stage{padding:74px 14px 20px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="world" aria-hidden="true"></canvas>

<div class="hud">
  <div class="gauge">
    <p class="k">DEPTH</p>
    <p class="v" id="depth">0m</p>
  </div>
  <div class="gauge mid">
    <div class="pips" id="pips"></div>
    <p class="k" id="stratum">SURFACE</p>
  </div>
  <div class="gauge score">
    <p class="k">SCORE</p>
    <p class="v" id="score">0</p>
  </div>
</div>

<main class="stage" id="stage"></main>

<script type="module" src="./main.js"></script>
</body>
</html>
